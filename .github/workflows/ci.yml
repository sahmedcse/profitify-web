name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm type-check

      - name: Build (static export)
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.profitify.com
          NEXT_PUBLIC_SITE_URL: https://profitify.com
          NEXT_PUBLIC_APP_ENV: production

      - name: Verify static output
        run: |
          test -d out
          test -f out/index.html
